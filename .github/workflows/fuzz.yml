# The program fuzzer (tools/fuzz): random typed Python programs in qtrans's subset, translated,
# compiled and checked against Python; a failure is shrunk to a minimal reproducer, which is
# uploaded with the run (Summary page -> Artifacts -> fuzz-report).
#   on every push: a fixed seed, 25 batches (500 programs), the same ones each time on any
#                  runner (a regression check; about 4 minutes)
#   by hand (Actions -> fuzz -> Run workflow): a new seed for 30 minutes, new programs; run
#   before each release, after the translator changes (a long local run does the same job)
name: fuzz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fuzz:
    name: ${{ github.event_name == 'workflow_dispatch' && 'new seed (30 min)' || 'fixed seed (500 programs)' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QTRANS_REQUIRE_CXX: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python packages (pinned)
        run: python -m pip install -r ci/requirements-pinned.txt

      - name: Install Eigen
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      - name: Fuzz
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m tools.fuzz --seed ${{ github.run_number }}000 --minutes 30 --shrink-minutes 8 --out fuzz_out
          else
            python -m tools.fuzz --seed 1 --batches 25 --minutes 20 --shrink-minutes 4 --out fuzz_out
          fi

      - name: Upload the report and reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report
          path: fuzz_out/
