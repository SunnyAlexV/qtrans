# Runs the full test suite (translation, compiled semantics, every example, the Python bindings)
# on Linux and Windows. On Windows, verify uses MinGW g++ and the bindings use MSVC, which is
# what Python's own build tools use there.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install numpy scipy pytest mpmath pybind11 setuptools

      - name: Install Eigen (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      - name: Install Eigen (Windows, through conda, as on an Anaconda machine)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:CONDA\Scripts\conda.exe" install -y -q -c conda-forge eigen
          "QTRANS_EIGEN=$env:CONDA\Library\include\eigen3" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Show the C++ compiler and Eigen qtrans will use
        run: |
          g++ --version
          python -c "from qtrans.verify import find_compiler, find_eigen; print(find_compiler()); print(find_eigen())"
          python -c "import pybind11; print('pybind11', pybind11.__version__)"

      - name: Run tests (a skipped test fails the run)
        env:
          QTRANS_REQUIRE_CXX: "1"
        run: python -m pytest -q -rs
