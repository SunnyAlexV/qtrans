[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrans"
version = "0.10.1"
description = "Translate typed quant-finance Python into readable, standalone C++, validated against the Python by differential testing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sunny Vellanikaran" }]
keywords = ["quant", "finance", "transpiler", "c++", "eigen", "numpy", "pybind11", "code generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]
dependencies = ["numpy", "scipy"]

[project.urls]
Homepage = "https://github.com/SunnyAlexV/qtrans"
Source = "https://github.com/SunnyAlexV/qtrans"
Issues = "https://github.com/SunnyAlexV/qtrans/issues"
Results = "https://github.com/SunnyAlexV/qtrans/blob/main/examples/RESULTS.md"

[project.optional-dependencies]
test = ["pytest", "mpmath", "pybind11>=2.10", "setuptools", "pandas"]
bind = ["pybind11>=2.10", "setuptools"]
tools = ["mpmath"]

[project.scripts]
qtrans = "qtrans.cli:main"

[tool.setuptools]
packages = ["qtrans", "qtrans.runtime"]  # runtime: the C++ headers the generated code includes

[tool.setuptools.package-data]
"qtrans.runtime" = ["*.hpp"]
"qtrans" = ["live_page.html"]  # the page qtrans live serves

[tool.pytest.ini_options]
testpaths = ["tests"]
